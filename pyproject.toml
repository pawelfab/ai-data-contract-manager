[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-data-contract-manager"
version = "0.1.0"
description = "Schema-authoritative conversational orchestrator for contract onboarding with Pydantic AI and MCP"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=1.20,<2",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai,web]>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
ai = ["pydantic-ai>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
