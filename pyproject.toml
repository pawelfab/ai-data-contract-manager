[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-contract-manager"
version = "0.1.0"
description = "Minimal ACDM web agent and mcp-contract-forge server."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=1.20,<2",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai,web]>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
acdm = "acdm.main:run"
mcp-contract-forge = "mcp_contract_forge.server:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
