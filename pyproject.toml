[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adcm-minimal"
version = "0.1.0"
description = "Minimal ADCM orchestrator + Contract Forge MCP reference implementation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.23,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]

mcp = [
  "fastmcp>=3.4.7,<4",
  "pydantic-ai-slim[mcp]>=2.32,<3"
]

openai = [
  "pydantic-ai-slim[mcp,openai]>=2.32,<3"
]

vertex = [
  "pydantic-ai-slim[mcp,google]>=2.32,<3"
]

dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1"
]

[project.scripts]
adcm-cli = "adcm.cli:main"
adcm-api = "adcm.api:main"
contract-forge-mcp = "contract_forge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
