[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-contract-forge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "jsonschema>=4.23,<5",
  "mcp>=2,<3",
  "uvicorn[standard]>=0.35,<1",
  "starlette>=0.47,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
contract-forge = "contract_forge.main:main"
