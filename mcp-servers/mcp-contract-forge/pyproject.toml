[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-contract-forge"
version = "0.1.0"
description = "Contract owner, enrichment engine and MCP server for ADCM"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1.0,<2",
  "mcp>=1.28,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10"
]

[project.scripts]
contract-forge-mcp = "contract_forge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
