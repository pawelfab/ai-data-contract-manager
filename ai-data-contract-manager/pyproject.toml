[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-data-contract-manager"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "mcp>=2,<3",
  "pydantic-ai-slim[google,mcp,openai]>=2.27,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/adcm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
