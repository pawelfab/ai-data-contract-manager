[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-data-contract-manager"
version = "0.4.0"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",

  # MCP client used by ADCM to call Contract Forge and other MCP services.
  "mcp>=2,<3",

  # Core PydanticAI runtime.
  # Provider-specific dependencies are installed through optional extras below.
  "pydantic-ai-slim>=2.27,<3",
]

[project.optional-dependencies]

# Local OpenAI-compatible endpoint, OpenAI API,
# LM Studio, proxy exposing /v1/chat/completions, etc.
openai = [
  "pydantic-ai-slim[openai]>=2.27,<3",
]

# Google / Vertex AI provider support.
google = [
  "pydantic-ai-slim[google]>=2.27,<3",
]

# Only needed if ADCM uses PydanticAI MCP toolsets directly.
# The standalone `mcp` dependency above is still used by our own MCP adapters.
pydantic-ai-mcp = [
  "pydantic-ai-slim[mcp]>=2.27,<3",
]

# Convenient development setup for the current local configuration.
local = [
  "pydantic-ai-slim[openai,mcp]>=2.27,<3",
]

# Production setup when using Google/Vertex + PydanticAI MCP integration.
vertex = [
  "pydantic-ai-slim[google,mcp]>=2.27,<3",
]

dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adcm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[project.scripts]
adcm = "adcm.main:run"