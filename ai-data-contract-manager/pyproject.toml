[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-contract-manager"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.13.5",
  "mcp==2.1.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
ai = ["pydantic-ai-slim[openai]==2.35.1"]
dev = ["pytest==8.4.1", "pytest-asyncio==0.25.3"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Testy live startują realne procesy Forge + ADCM, więc nie mogą wchodzić do
# domyślnego przebiegu. Wybiera się je jawnie: `-m live` albo `-m llm`
# (podane w linii poleceń `-m` nadpisuje ten z addopts).
markers = [
  "live: wymaga realnie uruchomionego ADCM REST API + realnego Contract Forge",
  "llm: dodatkowo wymaga realnego resolvera LLM (non-blocking)",
]
addopts = '-m "not live and not llm"'

[project.scripts]
adcm = "adcm.main:main"
