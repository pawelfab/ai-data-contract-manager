[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-contract-manager"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.13.5",
  "mcp==2.1.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
ai = ["pydantic-ai-slim[openai]==2.35.1"]
dev = ["pytest==8.4.1", "pytest-asyncio==0.25.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
adcm = "adcm.main:main"