[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-contract-manager"
version = "0.1.0"
description = "Conversational orchestrator and API client for data contract creation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-ai-slim[mcp]>=1.107.1,<2"
]

[project.optional-dependencies]

openai = [
  "pydantic-ai-slim[openai]>=1.107.1,<2"
]

vertex = [
  "pydantic-ai-slim[google]>=1.107.1,<2"
]

dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1"
]

[project.scripts]
adcm-cli = "adcm.cli:main"
adcm-api = "adcm.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
